kenya_road_safety:
  target: dev
  outputs:
    dev:
      type: snowflake
      account:   "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user:      "{{ env_var('SNOWFLAKE_USER') }}"
      password:  "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role:      TRANSFORMER
      database:  ROAD_SAFETY
      warehouse: KENYA_ANALYTICS_WH
      schema:    DBT_DEV
      threads:   4

    prod:
      type: snowflake
      account:   "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user:      "{{ env_var('SNOWFLAKE_USER') }}"
      password:  "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role:      TRANSFORMER
      database:  ROAD_SAFETY
      warehouse: KENYA_ANALYTICS_WH
      schema:    ANALYTICS
      threads:   4
